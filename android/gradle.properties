org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
# Local macOS override: if AGP picks up Android Studio's JBR and jlink fails,
# add org.gradle.java.home to ~/.gradle/gradle.properties pointing to a
# standard JDK (e.g. /Library/Java/JavaVirtualMachines/jdk-XX.jdk/Contents/Home).

android.useAndroidX=true
android.enableJetifier=false
android.suppressUnsupportedCompileSdk=35
