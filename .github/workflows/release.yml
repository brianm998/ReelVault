name: Release

# Triggered by a `v*` tag push (e.g. `git tag v0.2.0 && git push --tags`).
# Can also be run manually via Actions → "Run workflow" to test the pipeline
# without creating a tag — the release-publish job is skipped in that case.

on:
  push:
    tags: ['v*', 'release/*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g. 0.1.0). Defaults to value in Cargo.toml.'
        required: false

permissions:
  contents: write   # needed by the release-publish job

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Resolve the release version once; all other jobs read it ──────────────
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          elif [[ "$GITHUB_REF" == refs/tags/release/* ]]; then
            V="${GITHUB_REF_NAME#release/}"
          elif [[ -n "${{ inputs.version }}" ]]; then
            V="${{ inputs.version }}"
          else
            V="$(grep '^version' core/Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')"
          fi
          echo "version=$V"  >> "$GITHUB_OUTPUT"
          echo "tag=v$V"     >> "$GITHUB_OUTPUT"

  # ── Build the Rust core daemon for every target platform ──────────────────
  core:
    name: Core / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-x86_64,    os: ubuntu-latest     }
          - { name: linux-aarch64,   os: ubuntu-24.04-arm  }
          - { name: macos-universal, os: macos-latest      }
          - { name: windows-x86_64,  os: windows-latest    }

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('core/Cargo.toml') }}

      - name: Build and package
        shell: bash
        run: >
          ./release-core.sh --native
          --version "${{ needs.version.outputs.version }}"
          --out dist/core

      - uses: actions/upload-artifact@v4
        with:
          name: core-${{ matrix.name }}
          path: dist/core/
          if-no-files-found: error

  # ── Build Kotlin Compose desktop packages (native per OS) ─────────────────
  desktop:
    name: Desktop / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    needs: [version, core]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macos-arm64, os: macos-latest,   core-artifact: core-macos-universal, core-bin: videoroom-core     }
          - { name: linux,       os: ubuntu-latest,   core-artifact: core-linux-x86_64,    core-bin: videoroom-core     }
          - { name: windows,     os: windows-latest,  core-artifact: core-windows-x86_64,  core-bin: videoroom-core.exe }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.os }}-${{ hashFiles('desktop/build.gradle.kts', 'desktop/settings.gradle.kts') }}
          restore-keys: gradle-${{ matrix.os }}-

      # Linux .deb packaging requires fakeroot and binutils.
      - name: Install Linux packaging prerequisites
        if: matrix.name == 'linux'
        run: sudo apt-get install -y fakeroot binutils

      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.core-artifact }}
          path: core-dist/

      - name: Extract core binary
        shell: bash
        run: |
          cd core-dist
          for f in *.tar.gz; do [[ -f "$f" ]] && tar xzf "$f"; done
          for f in *.zip;    do [[ -f "$f" ]] && 7z x "$f" -y; done
          cd ..
          DAEMON=$(find core-dist -name "${{ matrix.core-bin }}" -type f | head -1)
          echo "DAEMON_BIN=${DAEMON}" >> "$GITHUB_ENV"

      # Import Developer ID Application + Installer certs on macOS runners.
      # No-op (has_cert=false) on Linux/Windows so those builds are unaffected.
      - name: Import Developer ID certificate
        id: cert
        if: runner.os == 'macOS'
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            echo "APPLE_CERTIFICATE_P12_BASE64 not set — ad-hoc signing only"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          TEAM="${{ secrets.APPLE_TEAM_ID }}"
          APP_N=$(security find-identity -v "$KC" | grep -c "Developer ID Application:.*${TEAM}" || true)
          PKG_N=$(security find-identity -v "$KC" | grep -c "Developer ID Installer:.*${TEAM}"  || true)
          if [[ "$APP_N" -lt 1 || "$PKG_N" -lt 1 ]]; then
            echo "::error::Missing Developer ID identities for team ${TEAM}." \
                 "Found Application=${APP_N}, Installer=${PKG_N} (need 1 of each)."
            exit 1
          fi
          rm -f "$P12"
          echo "has_cert=true" >> "$GITHUB_OUTPUT"

      - name: Stage App Store Connect API key
        if: runner.os == 'macOS'
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build and package
        shell: bash
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          SIGN_ARGS=()
          if [[ -n "${SIGN_IDENTITY:-}" && "${{ steps.cert.outputs.has_cert }}" == "true" ]]; then
            SIGN_ARGS+=(--sign "$SIGN_IDENTITY" --notarize)
          fi
          ./release-desktop.sh --core-bin "$DAEMON_BIN" --out dist/desktop "${SIGN_ARGS[@]}"

      - name: Clean up keychain and API key
        if: runner.os == 'macOS'
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$RUNNER_TEMP/private_keys"

      # jpackage writes its real diagnostics to per-task log files instead of
      # stdout, so a CI failure shows only "Exit code: 1". Dump them here.
      - name: Show jpackage logs on failure
        if: failure()
        shell: bash
        run: |
          LOGS_DIR=desktop/build/compose/logs
          if [[ -d "$LOGS_DIR" ]]; then
            find "$LOGS_DIR" -type f | while read -r f; do
              echo "===== $f ====="
              cat "$f"
            done
          else
            echo "No logs at $LOGS_DIR"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}
          path: dist/desktop/
          if-no-files-found: error

  # ── Build SwiftUI macOS app ───────────────────────────────────────────────
  app-macos:
    name: macOS App (Swift)
    runs-on: macos-latest
    needs: [version, core]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: swift-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: swift-

      - uses: actions/download-artifact@v4
        with:
          name: core-macos-universal
          path: core-dist/

      - name: Extract core binary
        shell: bash
        run: |
          cd core-dist && tar xzf *.tar.gz && cd ..
          DAEMON=$(find core-dist -name "videoroom-core" -type f | head -1)
          echo "DAEMON_BIN=${DAEMON}" >> "$GITHUB_ENV"

      # Import Developer ID Application + Installer certs into a throwaway
      # keychain. The .p12 must contain both identities and their private keys.
      # Gracefully skips (outputs has_cert=false) if the secret is absent.
      - name: Import Developer ID certificate
        id: cert
        env:
          P12_B64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            echo "APPLE_CERTIFICATE_P12_BASE64 not set — ad-hoc signing only"
            echo "has_cert=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          KC="$RUNNER_TEMP/build.keychain"
          P12="$RUNNER_TEMP/certs.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign \
            -T /usr/bin/pkgbuild \
            -T /usr/bin/productsign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v "$KC"
          TEAM="${{ secrets.APPLE_TEAM_ID }}"
          APP_N=$(security find-identity -v "$KC" | grep -c "Developer ID Application:.*${TEAM}" || true)
          PKG_N=$(security find-identity -v "$KC" | grep -c "Developer ID Installer:.*${TEAM}"  || true)
          if [[ "$APP_N" -lt 1 || "$PKG_N" -lt 1 ]]; then
            echo "::error::Missing Developer ID identities for team ${TEAM}." \
                 "Found Application=${APP_N}, Installer=${PKG_N} (need 1 of each)."
            exit 1
          fi
          rm -f "$P12"
          echo "has_cert=true" >> "$GITHUB_OUTPUT"

      - name: Stage App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID:  ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      - name: Build .app and .pkg
        env:
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/private_keys/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          SIGN_ARGS=()
          if [[ "${{ steps.cert.outputs.has_cert }}" == "true" && -n "$SIGN_IDENTITY" ]]; then
            SIGN_ARGS+=(--sign "$SIGN_IDENTITY" --notarize)
          fi
          ./release-macos.sh \
            --core-bin "$DAEMON_BIN" \
            --version  "${{ needs.version.outputs.version }}" \
            "${SIGN_ARGS[@]}" \
            --out      dist/macos

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" || true
          rm -rf "$RUNNER_TEMP/private_keys"

      - uses: actions/upload-artifact@v4
        with:
          name: app-macos
          path: dist/macos/*.pkg
          if-no-files-found: error

  # ── Publish draft GitHub Release with all artifacts ───────────────────────
  # Skipped on workflow_dispatch (no tag) so you can test the build pipeline
  # without accidentally creating a half-baked release.
  release-publish:
    name: Publish Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/tags/release/')
    needs: [version, core, desktop, app-macos]
    permissions:
      contents: write

    steps:
      # Download every artifact into release-artifacts/<artifact-name>/
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts/

      - name: List release artifacts
        run: find release-artifacts -type f | sort

      - uses: softprops/action-gh-release@v2
        with:
          tag_name:              ${{ needs.version.outputs.tag }}
          name:                  VideoRoom ${{ needs.version.outputs.version }}
          draft:                 true    # review before publishing
          generate_release_notes: true
          files:                 release-artifacts/**/*
