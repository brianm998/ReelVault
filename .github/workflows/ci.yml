name: CI

# Fast build + lint checks on every push and pull request.
# Does not produce release artifacts — use the Release workflow for that.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core: check + clippy + test ─────────────────────────────────────
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ci-core-${{ matrix.os }}-${{ hashFiles('core/Cargo.toml') }}
          restore-keys: ci-core-${{ matrix.os }}-

      - name: Check
        run: cargo check
        working-directory: core

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: core

      - name: Test
        run: cargo test
        working-directory: core

  # ── Kotlin desktop: compile check ────────────────────────────────────────
  desktop:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-gradle-${{ matrix.os }}-${{ hashFiles('shared/build.gradle.kts', 'desktop/build.gradle.kts') }}
          restore-keys: ci-gradle-${{ matrix.os }}-

      - name: Compile Kotlin
        shell: bash
        run: ./gradlew :shared:compileKotlin :desktop:compileKotlin --no-daemon

  # ── SwiftUI macOS: build check ────────────────────────────────────────────
  macos-swift:
    name: macOS Swift build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: ci-swift-v2-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: ci-swift-v2-

      - name: Build
        run: swift build
        working-directory: macos

  # ── SwiftUI iOS: simulator build check (no signing) ──────────────────────
  ios:
    name: iOS Swift build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # grpc-swift v2 needs the iOS 18 SDK → Xcode 16+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # The app links the embedded Rust core as ReelVaultCore.xcframework
      # (gitignored build artifact). Build it before xcodebuild — it needs the
      # iOS Rust targets and protoc (the core's build.rs runs tonic_build).
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios

      - uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ci-ios-core-${{ hashFiles('core/Cargo.toml') }}
          restore-keys: ci-ios-core-

      - uses: actions/cache@v4
        with:
          path: ios/DerivedData/SourcePackages
          key: ci-ios-spm-${{ hashFiles('kit/Package.swift', 'ios/project.yml') }}
          restore-keys: ci-ios-spm-

      - name: Build embedded-core XCFramework
        run: make xcframework
        working-directory: ios

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      - name: Build (simulator, unsigned)
        run: >
          xcodebuild
          -project ReelVault.xcodeproj
          -scheme ReelVault
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          -derivedDataPath DerivedData
          CODE_SIGNING_ALLOWED=NO
          build
        working-directory: ios
