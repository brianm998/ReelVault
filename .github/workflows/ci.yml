name: CI

# Fast build + lint checks on every push and pull request.
# Does not produce release artifacts — use the Release workflow for that.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust core: check + clippy + test ─────────────────────────────────────
  core:
    name: Core / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            core/target
          key: ci-core-${{ matrix.os }}-${{ hashFiles('core/Cargo.toml') }}
          restore-keys: ci-core-${{ matrix.os }}-

      - name: Check
        run: cargo check
        working-directory: core

      - name: Clippy
        run: cargo clippy -- -D warnings
        working-directory: core

      - name: Test
        run: cargo test
        working-directory: core

  # ── Kotlin desktop: compile check ────────────────────────────────────────
  desktop:
    name: Desktop / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ci-gradle-${{ matrix.os }}-${{ hashFiles('desktop/build.gradle.kts') }}
          restore-keys: ci-gradle-${{ matrix.os }}-

      - name: Compile Kotlin
        shell: bash
        run: ./gradlew compileKotlin --no-daemon
        working-directory: desktop

  # ── SwiftUI macOS: build check ────────────────────────────────────────────
  macos-swift:
    name: macOS Swift build
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: macos/.build
          key: ci-swift-${{ hashFiles('macos/Package.resolved') }}
          restore-keys: ci-swift-

      - name: Build
        run: swift build
        working-directory: macos
