name: Deploy download page to GitHub Pages

on:
  push:
    branches: [develop]
    paths:
      - 'docs/**'
  workflow_dispatch:   # allow manual re-deploy

permissions:
  contents: read
  pages:    write
  id-token: write

# Prevent concurrent deploys; let the latest push win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Only deploy the public-facing docs/ content (the markdown design docs
      # are not included in the Pages site — they remain readable in the repo
      # but are not served as web pages).
      - name: Prepare site content
        run: |
          mkdir -p _site
          cp docs/index.html _site/index.html
          cp docs/pitch.html _site/pitch.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

      - uses: actions/deploy-pages@v4
        id: deploy
