name: iOS TestFlight

# Builds, signs, and uploads the iOS app to TestFlight, from where it can be
# manually promoted to an App Store review submission. Run on demand
# (workflow_dispatch) or when a version tag is pushed.
#
# Reused secrets (already configured for the macOS release pipeline):
#   APPLE_TEAM_ID, APPLE_API_KEY_P8_BASE64, APPLE_API_KEY_ID,
#   APPLE_API_ISSUER_ID, KEYCHAIN_PASSWORD
# New secrets this workflow needs:
#   IOS_DIST_CERT_P12_BASE64    base64 of the Apple Distribution cert (.p12)
#   IOS_DIST_CERT_PASSWORD      the .p12 export password
#   IOS_PROVISION_PROFILE_BASE64  base64 of the App Store provisioning profile

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
      - 'ios-v*'

env:
  BUNDLE_ID: com.preffect.reelvault.ios
  SCHEME: ReelVault

jobs:
  testflight:
    name: Archive & upload to TestFlight
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # grpc-swift v2 needs the iOS 18 SDK → Xcode 16+.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate
        working-directory: ios

      # ── Code-signing setup ────────────────────────────────────────────────
      - name: Import Apple Distribution certificate
        env:
          P12_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          P12_PASS: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          KC_PASS: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [[ -z "$P12_B64" ]]; then
            echo "::error::IOS_DIST_CERT_P12_BASE64 not set — cannot sign for TestFlight."
            exit 1
          fi
          KC="$RUNNER_TEMP/ios-build.keychain"
          P12="$RUNNER_TEMP/ios-dist.p12"
          echo "$P12_B64" | base64 --decode > "$P12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$P12" -k "$KC" -P "$P12_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" \
            $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KC"
          rm -f "$P12"

      - name: Install provisioning profile
        id: profile
        env:
          PROFILE_B64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          if [[ -z "$PROFILE_B64" ]]; then
            echo "::error::IOS_PROVISION_PROFILE_BASE64 not set."
            exit 1
          fi
          PROFILES="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES"
          PROFILE="$PROFILES/reelvault.mobileprovision"
          echo "$PROFILE_B64" | base64 --decode > "$PROFILE"
          # The profile name is what xcodebuild's PROVISIONING_PROFILE_SPECIFIER
          # and the export options map to.
          NAME=$(security cms -D -i "$PROFILE" \
            | plutil -extract Name raw -o - -)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Installed provisioning profile: $NAME"

      - name: Stage App Store Connect API key
        env:
          KEY_B64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/private_keys"
          echo "$KEY_B64" | base64 --decode \
            > "$RUNNER_TEMP/private_keys/AuthKey_${KEY_ID}.p8"

      # ── Archive + export ──────────────────────────────────────────────────
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: >
          xcodebuild
          -project ReelVault.xcodeproj
          -scheme "$SCHEME"
          -configuration Release
          -sdk iphoneos
          -archivePath "$RUNNER_TEMP/ReelVault.xcarchive"
          -derivedDataPath DerivedData
          DEVELOPMENT_TEAM="$TEAM_ID"
          CODE_SIGN_STYLE=Manual
          CODE_SIGN_IDENTITY="Apple Distribution"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          archive
        working-directory: ios

      - name: Write ExportOptions.plist
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ steps.profile.outputs.name }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>${TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key>
              <string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Export .ipa
        run: >
          xcodebuild -exportArchive
          -archivePath "$RUNNER_TEMP/ReelVault.xcarchive"
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"
          -exportPath "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        env:
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          # altool / Transporter look here for the .p8 key.
          API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/private_keys
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          echo "Uploading $IPA"
          xcrun altool --upload-app --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID"

      - name: Clean up keychain and API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ios-build.keychain" || true
          rm -rf "$RUNNER_TEMP/private_keys"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/reelvault.mobileprovision"

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ReelVault-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: ignore
