syntax = "proto3";

package reelvault;

// Core service definition
service ReelVault {
  // Query operations
  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse);
  rpc SearchVideos(SearchRequest) returns (SearchResponse);
  rpc GetMetadata(GetMetadataRequest) returns (VideoMetadata);
  rpc GetThumbnail(GetThumbnailRequest) returns (stream ThumbnailChunk);

  // Library management
  rpc AddLibraryLocation(AddLocationRequest) returns (LocationResponse);
  rpc RemoveLibraryLocation(RemoveLocationRequest) returns (LocationResponse);
  rpc ListLibraryLocations(ListLocationsRequest) returns (ListLocationsResponse);
  // Enumerate the immediate child directories of a directory that contain
  // (recursively) at least one grid-visible video. Powers the library panel's
  // expandable subdirectory tree. The directory tree is derived from indexed
  // video paths in SQLite — no filesystem walk.
  rpc ListSubdirectories(ListSubdirectoriesRequest) returns (ListSubdirectoriesResponse);
  rpc ScanLibrary(ScanLibraryRequest) returns (stream ScanProgress);
  rpc GetScanStatus(GetScanStatusRequest) returns (ScanStatusResponse);

  // Tags
  rpc CreateTag(CreateTagRequest) returns (TagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (Response);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc TagVideos(TagVideosRequest) returns (Response);
  rpc UntagVideos(UntagVideosRequest) returns (Response);

  // Collections
  rpc CreateCollection(CreateCollectionRequest) returns (CollectionResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (Response);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc AddToCollection(AddToCollectionRequest) returns (Response);
  rpc RemoveFromCollection(RemoveFromCollectionRequest) returns (Response);

  // Video operations
  rpc UpdateVideoNotes(UpdateNotesRequest) returns (Response);
  rpc DeleteVideo(DeleteVideoRequest) returns (Response);

  // Groups (Lightroom-style "stacks")
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse);
  rpc CreateGroup(CreateGroupRequest) returns (GroupResponse);
  rpc UngroupVideo(UngroupVideoRequest) returns (Response);
  rpc SetGroupPreferred(SetGroupPreferredRequest) returns (Response);
  rpc AutoGroupVideos(AutoGroupRequest) returns (AutoGroupResponse);

  // Proxies
  rpc GenerateProxy(GenerateProxyRequest) returns (stream ProxyGenerationProgress);
  rpc ListProxies(ListProxiesRequest) returns (ListProxiesResponse);
  rpc SetProxyOf(SetProxyOfRequest) returns (Response);
  rpc RemoveProxyLink(RemoveProxyLinkRequest) returns (Response);
  rpc DetectProxies(DetectProxiesRequest) returns (DetectProxiesResponse);
  rpc AttachProxies(AttachProxiesRequest) returns (AttachProxiesResponse);

  // Filter options (distinct values for the grid's dropdowns)
  rpc GetFilterOptions(GetFilterOptionsRequest) returns (FilterOptions);

  // Faceted filter values for the Library Filter's "metadata" mode. Given the
  // upstream filters (library location, keywords, attributes, text) and an
  // ordered list of metadata columns, returns the distinct values available
  // for each column — where column i is constrained by every column to its
  // left (the left→right cascade) — plus the set of metadata keys that have
  // any data in the current filtered set (for the column key picker).
  rpc GetMetadataFacets(MetadataFacetsRequest) returns (MetadataFacetsResponse);

  // System
  rpc GetStatus(GetStatusRequest) returns (StatusResponse);
  rpc GetConfig(GetConfigRequest) returns (ConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (Response);

  // Pairing — a desktop/loopback client mints a one-time 6-digit code that the
  // operator types on a new remote device (the iOS app) to authorize it. The
  // same pending-code state backs the media server's POST /pair, which the new
  // device calls to redeem the code for a bearer token. Intended for loopback
  // callers; the LAN bind requires a token a new device doesn't have yet.
  rpc StartPairing(StartPairingRequest) returns (StartPairingResponse);

  // Catalog lifecycle — the catalog is the SQLite file backing the daemon.
  // Switching catalogs at runtime lets a single server process serve multiple
  // libraries over its lifetime; the client treats each as a separate session.
  rpc OpenCatalog(OpenCatalogRequest) returns (CatalogInfo);
  rpc CloseCatalog(CloseCatalogRequest) returns (Response);
  rpc GetCurrentCatalog(GetCurrentCatalogRequest) returns (CatalogInfo);

  // Geolocation — set or correct the GPS coordinates for one or more videos,
  // and enumerate every video that has known coordinates (for the global map).
  rpc UpdateVideoLocation(UpdateVideoLocationRequest) returns (Response);
  rpc ListVideosWithLocations(ListVideosWithLocationsRequest) returns (VideoLocationsResponse);

  // Named locations — user-defined names for specific lat/lon points (e.g.
  // "Home", "Yosemite Valley Visitor Center"). Clients resolve any video's
  // GPS into a name by proximity (default 250 m) using ListNamedLocations,
  // then cache the result. Names are also written by the location picker.
  rpc ListNamedLocations(ListNamedLocationsRequest) returns (NamedLocationsResponse);
  rpc UpsertNamedLocation(UpsertNamedLocationRequest) returns (NamedLocationResponse);
  rpc DeleteNamedLocation(DeleteNamedLocationRequest) returns (Response);

  // Capture date/time — set or correct when a video was recorded. Mirrors
  // UpdateVideoLocation: catalog is always updated; the file's metadata is
  // touched (via ffmpeg's `-metadata creation_time=...`) only when the
  // client asks for it.
  rpc UpdateVideoCaptureDate(UpdateVideoCaptureDateRequest) returns (Response);

  // Lightroom-style user marks. The grid renders the rating as star/dots
  // along the bottom of each card, and the color label as the band-color
  // around the card. Both take a list of video IDs so a multi-select keyboard
  // shortcut applies in a single round-trip.
  rpc UpdateVideoRating(UpdateVideoRatingRequest) returns (Response);
  rpc UpdateVideoColorLabel(UpdateVideoColorLabelRequest) returns (Response);

  // Grid layout preferences — per-catalog so two clients open against the
  // same catalog show the same top-of-card stat slots. GridSettings carries
  // exactly four slot keys (empty string = unset / blank slot).
  rpc GetGridSettings(GetGridSettingsRequest) returns (GridSettings);
  rpc UpdateGridSettings(GridSettings) returns (Response);

  // Live catalog change events. Subscribe once on connect to receive a
  // never-ending stream of `CatalogEvent`s as the daemon's file watcher
  // adds, modifies, or removes videos in the background. The client uses
  // this to refresh its grid without re-polling ListVideos. The first
  // event after subscribing is always `WATCHER_STARTED` (or
  // `WATCHER_DISABLED` if the user turned the watcher off), which lets
  // clients display a "live updates: on/off" affordance without an extra
  // round-trip.
  rpc SubscribeCatalogEvents(SubscribeCatalogEventsRequest) returns (stream CatalogEvent);

  // Watcher settings — surface the three knobs (enabled, write-settle
  // ms, poll-fallback ms) that govern real-time scanning. Updates take
  // effect immediately; the server restarts its watcher with the new
  // settings on UpdateWatchSettings.
  rpc GetWatchSettings(GetWatchSettingsRequest) returns (WatchSettings);
  rpc UpdateWatchSettings(WatchSettings) returns (Response);

  // Camera marketing-name mappings — internal model code → marketing
  // name. The daemon ships a built-in table (see
  // `core/src/camera_names.rs`); users can add their own overrides
  // (or correct built-in entries they disagree with) via the
  // SetCameraNameMapping RPC. List returns the merged view —
  // built-in entries plus any active custom override — so clients
  // can render one unified table with a "Custom" badge on overridden
  // rows. Setting a marketing name equal to "" removes any custom
  // override and reveals the built-in mapping again.
  rpc ListCameraNameMappings(ListCameraNameMappingsRequest)
      returns (ListCameraNameMappingsResponse);
  rpc SetCameraNameMapping(SetCameraNameMappingRequest) returns (Response);

  // Lens display-name overrides — raw lens string (as stored in the
  // catalog, i.e. the value extracted from `exifEX:LensModel`) → a
  // user-chosen display name. Unlike cameras there is no built-in
  // table: the universe is the set of lens strings actually present in
  // the catalog. List returns one row per distinct catalog lens, plus
  // any custom-only overrides whose lens no longer appears, each
  // carrying the active display name and a custom flag. Setting an
  // alias equal to "" removes the override and reveals the raw value.
  rpc ListLensNameMappings(ListLensNameMappingsRequest)
      returns (ListLensNameMappingsResponse);
  rpc SetLensNameMapping(SetLensNameMappingRequest) returns (Response);

  // --- Catalog Sync (Phase 0-5) ---
  rpc GetSyncManifest(SyncManifestRequest) returns (stream SyncManifestEntry);
  rpc LookupByContentHash(LookupByContentHashRequest) returns (LookupByContentHashResponse);
  rpc GetVideoCatalogData(VideoCatalogDataRequest) returns (VideoCatalogData);
  rpc ApplyVideoCatalogData(ApplyCatalogDataRequest) returns (Response);
  rpc PrepareRendition(PrepareRenditionRequest) returns (stream PrepareRenditionProgress);
  rpc ListSyncProfiles(ListSyncProfilesRequest) returns (ListSyncProfilesResponse);
  rpc UpsertSyncProfile(UpsertSyncProfileRequest) returns (SyncProfileResponse);
  rpc DeleteSyncProfile(DeleteSyncProfileRequest) returns (Response);
  rpc GetSyncRun(GetSyncRunRequest) returns (SyncRunResponse);
}

// Messages for queries

// A single generic metadata filter. `key` is a canonical metadata token
// recognized by the daemon's metadata-key registry (see
// core/src/metadata_keys.rs) — one of `camera`, `lens`, `codec`, `year`,
// `iso`, `aperture`, `exposure`, `focal_length`, `keyword`, with room to grow
// to arbitrary XMP keys later. `value` is the exact token to match (the
// `token` field of a FacetValue); an empty `value` means "no constraint" (the
// column is a placeholder / "All").
message MetadataFilter {
  string key = 1;
  string value = 2;
}

// Tri-state toggle for the Library Filter's "attribute" presence filters
// (has location / has keywords / has proxies / is full resolution). ANY is
// the proto3 default (0) so an unset field means "no constraint". YES keeps
// only videos that have the attribute; NO keeps only those that don't — NO
// is the exact complement of YES, so YES ∪ NO together cover every video.
enum AttributeFilter {
  ATTRIBUTE_FILTER_ANY = 0;
  ATTRIBUTE_FILTER_YES = 1;
  ATTRIBUTE_FILTER_NO = 2;
}

message ListVideosRequest {
  int32 limit = 1;
  int32 offset = 2;
  // Sort token. Recognized values (case-insensitive):
  //   "name" / "filename", "date_added" / "indexed_at",
  //   "creation_date" / "shot_date" / "capture_date",
  //   "duration", "size", "resolution", "fps", "codec", "bitrate",
  //   "camera", "lens", "keyword", "rating", "color",
  //   "iso", "aperture", "exposure_time", "focal_length".
  string sort_by = 3;
  bool sort_ascending = 4;
  repeated string filter_tags = 5;
  string collection_id = 6;
  // Filter to videos whose path is inside this directory (recursive).
  // Empty means "all locations".
  string location_path = 7;
  // Exact-match filters from the top-bar dropdowns. Empty / 0 = no filter.
  string filter_camera = 8;
  string filter_lens = 9;
  string filter_codec = 10;
  int32 filter_capture_year = 11;
  // Geographic proximity filter — set `filter_by_location` true and provide
  // lat/lon/radius_km to limit results to videos whose recorded coordinates
  // fall within `filter_radius_km` of (filter_latitude, filter_longitude).
  // Used when the user taps a pin on the global map.
  bool filter_by_location = 12;
  double filter_latitude = 13;
  double filter_longitude = 14;
  double filter_radius_km = 15;
  // Lightroom-style user-mark filters.
  //   filter_min_rating: 0 = no filter; 1..5 = "≥ this many stars".
  //   filter_color_label: "" = no filter; otherwise exact match
  //     against one of "red" | "yellow" | "green" | "blue" | "purple".
  int32 filter_min_rating = 16;
  string filter_color_label = 17;
  // Generic metadata filters from the Library Filter's "metadata" columns.
  // AND-combined with everything else. Camera/lens/codec/year now travel here;
  // the scalar fields 8–11 above remain honored for back-compat but new
  // clients leave them empty and send these instead.
  repeated MetadataFilter metadata_filters = 18;
  // Full-text query (filename / notes), matched the same way as SearchVideos.
  // Empty = no text filter. Folding search into ListVideos lets the text
  // filter compose with all the others; the separate SearchVideos RPC remains
  // for legacy callers.
  string search_query = 19;
  // Tri-state presence filters from the Library Filter's "attribute" mode.
  // ANY (the default) leaves the dimension unconstrained; YES / NO keep only
  // videos that do / don't have the attribute. AND-combined with everything
  // else. `filter_full_resolution` YES keeps videos whose recorded resolution
  // matches a known native sensor mode for their camera (see
  // FullResolutionStatus / core/src/full_resolution.rs); NO keeps the rest
  // (NOT_FULL and UNSPECIFIED alike).
  AttributeFilter filter_has_location = 20;
  AttributeFilter filter_has_keywords = 21;
  AttributeFilter filter_has_proxies = 22;
  AttributeFilter filter_full_resolution = 23;
}

message VideoSummary {
  string id = 1;
  string filename = 2;
  string path = 3;
  int64 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
  string codec_video = 7;
  string codec_audio = 8;
  double fps = 9;
  int64 size_bytes = 10;
  int64 indexed_at = 11;  // Unix timestamp ms
  int64 creation_date = 12;
  repeated string tags = 13;
  bool has_thumbnail = 14;
  // Group info
  string group_id = 15;           // Empty if not in a group
  int32 group_size = 16;          // Number of videos in the group (1 if not grouped)
  string group_preferred_id = 17; // Which video to open by default (e.g. on double-click)
  string group_preferred_path = 18; // Direct path to preferred video for convenience
  // Proxy info. `proxy_count` = how many lower-resolution variants of
  // this clip exist in the catalog; the grid renders a small badge when
  // > 0. `proxy_of` = the source video's id when this row is itself a
  // proxy; the grid hides proxies under their source unless the user
  // clicks "show proxies" on the source card. `playable_natively` = the
  // server's verdict that this video fits under the user-configured
  // `max_native_playback_height` — surfaced so the client can render
  // "create a proxy" affordances without re-fetching ConfigResponse.
  int32 proxy_count = 19;
  string proxy_of = 20;
  bool playable_natively = 21;
  // Lightroom-style user marks. `rating` is 0..5 (0 means unrated).
  // `color_label` is "" (no label) or one of "red" / "yellow" / "green" /
  // "blue" / "purple". The grid renders rating as stars/dots in the bottom
  // band and color_label as the band's tint.
  int32 rating = 22;
  string color_label = 23;
  // Camera body. Surfaced on the summary so the grid's configurable
  // top-of-card "Camera" stat slot can render without a per-video
  // VideoMetadata roundtrip. `camera_model` is the raw EXIF string
  // (e.g. "SONY ILCE-7RM3"); `camera_display_name` is the resolved
  // marketing name (e.g. "Sony a7R III") with user overrides applied,
  // falling back to `camera_model` when no mapping exists.
  string camera_model = 24;
  string camera_display_name = 25;
  // GPS coordinates extracted from the video's embedded EXIF/metadata.
  // Both fields are 0.0 when the video has no embedded location. Carried
  // here so the grid card can show a location badge without a per-video
  // VideoMetadata round-trip.
  double gps_latitude = 26;
  double gps_longitude = 27;
  // Photo-EXIF subset surfaced on the summary so the grid can sort and
  // filter by these without a per-row VideoMetadata round-trip. Sourced
  // from the video's embedded XMP packet (see xmp.rs); all-zero / empty
  // when the video carries no XMP. Lens is the Adobe-canonical
  // `aux:Lens` string; the rest mirror the standard EXIF semantics.
  string lens_model = 28;
  int32 iso = 29;
  double aperture = 30;          // f-number, e.g. 1.8
  double exposure_time_s = 31;   // seconds; 1/4000 -> 0.00025
  double focal_length_mm = 32;
  // Full-resolution classification (see core/src/full_resolution.rs).
  // FULL means the recorded (width, height) matches a known native
  // sensor mode for `camera_model`; NOT_FULL means the camera is known
  // but the resolution doesn't match either a sensor native or a common
  // video standard; UNSPECIFIED means we can't tell — either the camera
  // is unknown, or the resolution is a common standard (UHD/FHD/etc.)
  // we deliberately refuse to classify. Clients render badges for FULL
  // and NOT_FULL; UNSPECIFIED renders no badge.
  FullResolutionStatus full_resolution = 33;
  // True when the file was present at the most recent scan; false when it has
  // been moved, renamed, or its drive is unmounted (soft-deleted via
  // is_online = 0 in the catalog). Clients dim such cards and badge them
  // "offline" rather than only failing when the user hits play.
  bool is_online = 34;
  // Overall stream bitrate in bits per second (ffprobe's bit_rate), copied
  // from the video's metadata row. 0 when unknown. Surfaced on the summary —
  // like camera/lens/the EXIF subset above — so the grid's configurable
  // "Bitrate" stat slot renders without a per-video VideoMetadata round-trip.
  // Same unit as VideoMetadata.bitrate; clients divide by 1000 for kbps.
  int64 bitrate = 35;
  // ffprobe's nb_frames for the video stream, copied from the metadata row and
  // stored at index time. 0 when the container didn't report a frame count
  // (clients then estimate from duration × fps). Surfaced on the summary — like
  // bitrate/iso/etc. above — so the grid's configurable "Frame count" stat slot
  // renders without a per-video VideoMetadata round-trip.
  int64 frame_count = 36;
  // Color / dynamic-range + timecode + capture rate, surfaced on the summary
  // (like the EXIF subset above) so the grid and the iOS inspector render them
  // without a per-video VideoMetadata round-trip. `dynamic_range` is the
  // friendly label ("SDR"/"HDR (HLG)"/"Log (S-Log3)"/"RAW"); `timecode` is the
  // SMPTE start ("HH:MM:SS:FF"); `capture_fps` > fps means slow-motion. Empty/0
  // when absent.
  string dynamic_range = 37;
  string timecode = 38;
  double capture_fps = 39;
  // Coded video bit depth (8/10/12/16; 0 unknown), PCM audio depth (0 when
  // compressed), primary audio language ("" when und), and audio-track count.
  // Carried on the summary like the EXIF subset so the grid/iOS inspector
  // render them without a per-video round-trip.
  int32 bit_depth = 40;
  int32 audio_bit_depth = 41;
  string audio_language = 42;
  int32 audio_track_count = 43;
  // True for stereoscopic MV-HEVC (Apple Vision Pro "spatial") video.
  bool spatial = 44;
  // Spherical/360 projection ("equirectangular", …); empty if not 360.
  string projection = 45;
  // GoPro/drone GPS-track total distance (metres; 0 if none). The full polyline
  // is detail-only (VideoMetadata.gps_track) — only the distance stat rides the
  // summary so the inspector can show it without a per-video round-trip.
  double gps_track_distance_m = 46;
  // True when this video is a derived/synced copy imported from a remote peer.
  bool is_derived = 47;
}

enum FullResolutionStatus {
  // Prost strips the SCREAMING_SNAKE form of the enum name from each
  // value, so these become `FullResolutionStatus::{Unspecified, Full,
  // NotFull}` on the Rust side. Keep the prefix matching exactly.
  FULL_RESOLUTION_STATUS_UNSPECIFIED = 0;
  FULL_RESOLUTION_STATUS_FULL = 1;
  FULL_RESOLUTION_STATUS_NOT_FULL = 2;
}

message ListVideosResponse {
  repeated VideoSummary videos = 1;
  int64 total_count = 2;
  bool has_more = 3;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
  repeated string filter_tags = 4;
}

message SearchResponse {
  repeated VideoSummary videos = 1;
  int64 total_count = 2;
}

message GetMetadataRequest {
  string video_id = 1;
}

message VideoMetadata {
  string id = 1;
  string filename = 2;
  string path = 3;
  int64 size_bytes = 4;
  int64 duration_ms = 5;

  // Video technical
  int32 width = 6;
  int32 height = 7;
  double fps = 8;
  int64 bitrate = 9;
  string codec_video = 10;
  string color_space = 11;
  bool hdr = 12;

  // Audio technical
  string codec_audio = 13;
  int32 audio_channels = 14;
  int32 audio_sample_rate = 15;

  // Dates
  int64 creation_date = 16;  // From video metadata
  int64 modification_date = 17;
  int64 indexed_at = 18;

  // EXIF/Camera data
  string camera_model = 19;
  string lens_model = 20;

  // GPS
  double gps_latitude = 21;
  double gps_longitude = 22;
  double gps_altitude = 23;

  // Organization
  repeated string tags = 24;
  repeated string collections = 25;
  string notes = 26;

  // Volume info
  string volume_id = 27;
  bool is_online = 28;

  // Lightroom-style user marks (mirror of VideoSummary.rating /
  // color_label so the detail panel doesn't need a second lookup).
  int32 rating = 29;
  string color_label = 30;
  // Marketing-friendly camera name when the core knows one for
  // `camera_model`. Defaults to `camera_model` verbatim when no
  // mapping is known — clients can detect "no mapping" by checking
  // whether the two fields match.
  string camera_display_name = 31;
  // Photo-EXIF fields recovered from the video's embedded XMP packet
  // (parsed by xmp.rs). Each is "absent" in a domain-specific way: a
  // zero or empty string means the video didn't carry that field.
  //
  //   - iso, aperture, exposure_time_s, focal_length_mm: numerics that
  //     enable sort/filter. Aperture is the f-number (e.g. 1.8);
  //     exposure_time_s is seconds (1/4000 -> 0.00025).
  //   - exposure_mode / exposure_program / white_balance: short
  //     human-readable strings translated from their EXIF integer
  //     codes ("Manual", "Aperture-priority", "Auto", …) — the raw
  //     codes are not exposed, since the client never needs them.
  int32 iso = 32;
  double aperture = 33;
  double exposure_time_s = 34;
  double focal_length_mm = 35;
  string exposure_mode = 36;
  string exposure_program = 37;
  string white_balance = 38;
  // Mirror of VideoSummary.full_resolution — see that field's doc
  // comment and the FullResolutionStatus enum for semantics. Computed
  // server-side via core/src/full_resolution.rs.
  FullResolutionStatus full_resolution = 39;
  // Total frame count from the container (ffprobe's nb_frames), or 0 when the
  // container doesn't report one. Clients fall back to duration × fps for an
  // (approximate) estimate when this is 0.
  int64 frame_count = 40;

  // Color / dynamic-range. `color_transfer` (EOTF, e.g. "bt709", "smpte2084",
  // "arib-std-b67") and `color_primaries` ("bt709", "bt2020") are the raw
  // ffprobe values; `dynamic_range` is the friendly derived label the clients
  // display and filter on ("SDR", "HDR (PQ)", "HDR (HLG)", "Log (S-Log3)",
  // "RAW"). All empty when the clip carries no color signal.
  string color_transfer = 41;
  string color_primaries = 42;
  string dynamic_range = 43;
  // SMPTE start timecode from the tmcd track ("HH:MM:SS:FF"); empty if none.
  string timecode = 44;
  // Sensor capture frame rate. 0 when unknown. When > fps the clip is
  // slow-motion (clients derive the "240 → 30 fps" badge from capture_fps/fps).
  double capture_fps = 45;
  // Coded video bit depth (8/10/12/16); 0 when unknown.
  int32 bit_depth = 46;
  // Audio: PCM sample depth (0 for compressed/unknown), primary-track language
  // (empty when "und"/absent), and total audio-track count.
  int32 audio_bit_depth = 47;
  string audio_language = 48;
  int32 audio_track_count = 49;
  // True for stereoscopic MV-HEVC (Apple Vision Pro "spatial") video.
  bool spatial = 50;
  // Spherical/360 projection ("equirectangular", "cubemap", …); empty if not 360.
  string projection = 51;
  // GoPro/drone movement path: a downsampled JSON polyline `[[lat,lon],…]` for a
  // map track overlay (empty if no GPS telemetry), and its total ground distance
  // in metres (0 if none). Detail-only — not on the grid summary.
  string gps_track = 52;
  double gps_track_distance_m = 53;
  // GoPro GPMF motion series: accelerometer magnitude envelope and gyroscope
  // magnitude envelope, each downsampled to 480 float32 values stored as
  // little-endian bytes (empty when no GPMF or non-GoPro).
  bytes accel_magnitude = 54;
  bytes gyro_magnitude = 55;
  // IPTC Core / Editorial metadata from the embedded XMP packet (Dublin Core +
  // Photoshop namespaces). All empty when not present.
  string description = 56;
  string creator = 57;
  string rights = 58;
  repeated string keywords = 59;
  string headline = 60;
  // Chapter tracks and embedded subtitle tracks. chapter_count is the number of
  // chapters (0 when none); chapters_json is a JSON array of {title, start_ms,
  // end_ms} objects (empty when none). subtitle_tracks is the count of subtitle
  // streams (0 when none).
  int32 chapter_count = 61;
  string chapters_json = 62;
  int32 subtitle_tracks = 63;
  // Dolby Vision profile number (0–9 for profiles 4, 5, 8.1, 8.4, etc.);
  // -1 absent. Influences the dynamic_range label when present.
  int32 dolby_vision_profile = 64;
  // Sony Professional XML sidecar metadata: production scene and take numbers,
  // ND filter setting, iris F-number, and LUT name. All empty when not present.
  string production_scene = 65;
  string production_take = 66;
  string nd_filter = 67;
  double iris_f_number = 68;
  string lut_name = 69;
  // Extended 360° / spatial audio parameters: initial viewer orientation (yaw,
  // pitch, roll in degrees), stereo mode ("top-bottom", "left-right", "mono"),
  // and ambisonics channel ordering ("ACN", "Furse-Malham"). All empty when not
  // present or not applicable.
  double spatial_initial_heading = 70;
  double spatial_initial_pitch = 71;
  double spatial_initial_roll = 72;
  string stereo_mode = 73;
  string ambisonics_channel_order = 74;
}

message GetThumbnailRequest {
  string video_id = 1;
  string size = 2;  // "small", "medium", "large", or "scrub_N"
  // Higher-resolution request. 0 = serve the cached default for `size`. When
  // > 0, the daemon serves (generating on demand) a variant of that frame at
  // this pixel width, never upscaled past the source — so the detail view can
  // ask for scrub frames sized to its render area ("all pixels at the display
  // size") without baking full-resolution stills for high-resolution videos.
  // Cached separately as `<id>_<size>_w<max_width>.jpg`.
  int32 max_width = 3;
}

message ThumbnailChunk {
  bytes data = 1;
}

