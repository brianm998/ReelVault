// Filter dropdown options (distinct values present in the library).
//
// The client uses these to populate the dropdowns next to the search field.
// Empty lists mean "no data for that field" and the client hides the dropdown.

message GetFilterOptionsRequest {}

message FilterOptions {
  repeated string cameras = 1;
  repeated string lenses = 2;
  repeated string codecs = 3;
  repeated int32 capture_years = 4;
  // Marketing-friendly names for each entry in `cameras`, in the same
  // order. Each value is either the curated marketing name (e.g.
  // "Sony a7R III") or — when no mapping exists — the internal name
  // verbatim. Clients can use these as the dropdown labels while
  // sending the matching `cameras` entry as the filter value.
  repeated string camera_display_names = 5;
}

// --- Faceted metadata filtering (Library Filter "metadata" mode) ---

message MetadataFacetsRequest {
  // Upstream narrowing filters — the same higher-level filters that scope the
  // grid (library location, keyword/tags, collection, geo proximity, the
  // Lightroom user-mark "attribute" filters, and the text query). Facet values
  // are computed within the set these select.
  string location_path = 1;
  repeated string filter_tags = 2;
  string collection_id = 3;
  bool filter_by_location = 4;
  double filter_latitude = 5;
  double filter_longitude = 6;
  double filter_radius_km = 7;
  int32 filter_min_rating = 8;
  string filter_color_label = 9;
  string search_query = 10;
  // The ordered metadata columns, left→right. Column i's returned values are
  // computed with every column to its LEFT applied (the cascade) plus all the
  // upstream filters above. A column whose `value` is empty adds no constraint;
  // a column whose `key` is empty is a placeholder slot (returns no values but
  // still occupies a position so the response stays index-aligned).
  repeated MetadataFilter columns = 11;
  // The same tri-state presence filters the grid applies (see
  // ListVideosRequest). Facet values are computed within the set these
  // select, so the counts stay consistent with the visible grid.
  AttributeFilter filter_has_location = 12;
  AttributeFilter filter_has_keywords = 13;
  AttributeFilter filter_has_proxies = 14;
  AttributeFilter filter_full_resolution = 15;
}

// One selectable value within a facet column.
message FacetValue {
  string token = 1;     // exact value to echo back as MetadataFilter.value
  string display = 2;   // human-readable label (e.g. "Sony a7R III", "1/4000 s", "f/1.8")
  int64 count = 3;      // videos matching this value within the column's cascade
}

// The available values for one metadata column.
message MetadataFacetColumn {
  string key = 1;            // echoes the request column's key ("" for a placeholder)
  string display_name = 2;   // human-readable column title ("Camera", "ISO", "Exposure")
  bool is_numeric = 3;       // formatting / sorting hint
  repeated FacetValue values = 4;
}

// A metadata key the user can choose for a column.
message MetadataKeyInfo {
  string key = 1;
  string display_name = 2;
  bool is_numeric = 3;
}

message MetadataFacetsResponse {
  // One entry per request column, in the SAME order (placeholder columns get an
  // empty `values` list) so clients align facets to columns by index.
  repeated MetadataFacetColumn columns = 1;
  // Every metadata key that has at least one value in the current upstream-
  // filtered set — populates each column's "change key" picker.
  repeated MetadataKeyInfo available_keys = 2;
}

// Catalog lifecycle

// Open / switch to the catalog file at `path`. If a catalog is currently
// open it's closed first. The file is created if it doesn't exist; the
// daemon initializes the schema on its first open.
message OpenCatalogRequest {
  string path = 1;
}

message CloseCatalogRequest {}

message GetCurrentCatalogRequest {}

// Information about the catalog the daemon currently has open. `path` is
// empty when no catalog is open — clients should treat that as a precondition
// failure for every other RPC.
message CatalogInfo {
  string path = 1;
  string name = 2;           // Display name (filename stem, e.g. "MyLibrary")
  int64 video_count = 3;     // Total videos currently indexed
  int64 opened_at_ms = 4;    // Unix ms at which this catalog was opened
}

// Geolocation

// Set or replace GPS coordinates on a single video. The catalog's metadata
// row is updated atomically. If `write_to_file` is true the daemon also
// writes the ISO 6709 `location` tag into the underlying video file via
// ffmpeg's `-metadata location=...` (using `-c copy` so no re-encoding
// happens). File mutation is opt-in because some users won't want ReelVault
// touching their original files.
message UpdateVideoLocationRequest {
  string video_id = 1;
  double latitude = 2;
  double longitude = 3;
  double altitude = 4;       // 0 if unknown
  bool write_to_file = 5;    // embed in the video file as well as the catalog
}

message ListVideosWithLocationsRequest {}

// A geotagged video — the minimum a client needs to render a pin on the
// global map and turn it into a grid filter when tapped.
message VideoLocation {
  string id = 1;
  string filename = 2;
  string path = 3;
  double latitude = 4;
  double longitude = 5;
  double altitude = 6;
  bool has_thumbnail = 7;
}

message VideoLocationsResponse {
  repeated VideoLocation locations = 1;
}

// User-named place (e.g. "Home" → 37.7749, -122.4194). The clients fetch
// every named location for the active catalog once on dialog open, then
// resolve each video's GPS to a name client-side by picking the nearest
// entry whose haversine distance is within `radius_m`.
message NamedLocation {
  string id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  double radius_m = 5;     // Resolution tolerance. Default 250 on new rows.
  int64 created_at_ms = 6; // Unix milliseconds (UTC), 0 if unknown.
  int64 updated_at_ms = 7;
}

message ListNamedLocationsRequest {}

message NamedLocationsResponse {
  repeated NamedLocation locations = 1;
}

// Insert or update a named location. If `id` is empty, a new row is created;
// otherwise the existing row is updated. `radius_m <= 0` falls back to the
// schema default (250 m).
message UpsertNamedLocationRequest {
  string id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  double radius_m = 5;
}

message NamedLocationResponse {
  bool success = 1;
  string message = 2;
  NamedLocation location = 3;  // The persisted row (with assigned id, timestamps).
}

message DeleteNamedLocationRequest {
  string id = 1;
}

// Capture date/time

// Set or replace the capture time on a single video. `timestamp_ms` is
// Unix milliseconds (UTC). If `write_to_file` is true the daemon embeds it
// into the underlying video file's container metadata via ffmpeg's
// `-metadata creation_time=...` (using `-c copy`, no re-encoding).
message UpdateVideoCaptureDateRequest {
  string video_id = 1;
  int64 timestamp_ms = 2;
  bool write_to_file = 3;
}

// --- Real-time catalog events (server → client) ---

message SubscribeCatalogEventsRequest {}

// A single change observed by the server's file watcher. `video_id` is set
// when the event refers to a specific video row; for watcher-lifecycle
// events (`WATCHER_STARTED`, `WATCHER_DISABLED`) it's empty and the client
// just updates its "live updates" indicator.
message CatalogEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    VIDEO_ADDED = 1;         // A new video was indexed.
    VIDEO_MODIFIED = 2;      // An existing video's file changed on disk.
    VIDEO_REMOVED = 3;       // A file disappeared; the video is now offline.
    WATCHER_STARTED = 4;     // Sent once on subscription when the watcher is active.
    WATCHER_DISABLED = 5;    // Sent once on subscription if watch_enabled = false.
    SCAN_STARTED = 6;        // A user-driven ScanLibrary just kicked off.
    SCAN_COMPLETED = 7;      // A user-driven ScanLibrary just finished.
    // Background post-index work — the proxy-detection / auto-grouping /
    // camera-sensor / timelapse passes the daemon runs after a video is
    // indexed, whether triggered by a ScanLibrary or by the file watcher
    // picking up changed files on disk. This work is CPU- and IO-heavy
    // (pairwise thumbnail hashing) and was previously invisible to
    // clients, so a long pass looked like the daemon had silently pegged
    // a core. These three kinds let clients show what it's doing and
    // roughly how far along it is. The payload rides in `post_index`.
    POST_INDEX_STARTED = 8;    // A non-trivial post-index pass began.
    POST_INDEX_PROGRESS = 9;   // Periodic progress while it runs (~1/sec).
    POST_INDEX_COMPLETED = 10; // The pass drained; clients clear the panel.
    // An UNPAIRED device on the LAN asked to pair (hit POST /pair/request).
    // Desktop/macOS clients pop an "allow this device?" banner; `message`
    // carries the device name. Lets the daemon prompt the user instead of the
    // user having to pre-emptively open "Pair a New Device".
    PAIRING_REQUESTED = 11;
  }
  Kind kind = 1;
  string video_id = 2;       // Empty for watcher-lifecycle events.
  string path = 3;           // The file that triggered the event (best-effort).
  int64 at_ms = 4;           // Server-side Unix milliseconds.
  // Optional human-readable note. For SCAN_* events, the user-facing
  // location path; for VIDEO_REMOVED, the prior filename so the client
  // can display a meaningful toast.
  string message = 5;
  // Populated only for POST_INDEX_* kinds (absent otherwise). Carries the
  // counts, current phase, and ETA the client renders in its
  // background-activity panel.
  PostIndexProgress post_index = 6;
}

// Progress for a background post-index pass (proxy detection, auto-
// grouping, camera-sensor lookups, timelapse auto-tagging). Rides inside
// POST_INDEX_* `CatalogEvent`s.
//
// Counts are per *pass*. A `ScanLibrary` drains one big pass, so `total`
// covers the whole scan and the ETA is meaningful end-to-end. The file
// watcher instead processes settled files in waves — each wave is its own
// short pass — so clients should treat back-to-back passes as one
// continuous "busy" state (linger briefly on COMPLETED) rather than a
// single global percentage.
message PostIndexProgress {
  int64 processed = 1;       // Videos fully post-indexed in this pass.
  int64 total = 2;           // Expected videos this pass; 0 = unknown.
  double percent = 3;        // 0..100 (0 when total is unknown).
  int64 eta_seconds = 4;     // Estimated seconds remaining; 0 = unknown.
  // Dominant current activity, one of: "grouping" | "proxies" |
  // "sensors" | "tagging". Proxy detection dominates wall-clock, so this
  // usually reads "proxies" — the honest answer to "why is the core busy?".
  string phase = 5;
  // Last human-readable action, e.g. "linked clip_1080p.mov → clip_4k.mov".
  // Lets the panel show live activity even when `total` is unknown.
  string detail = 6;
}

// --- Watch settings (client ↔ server) ---

message GetWatchSettingsRequest {}

message WatchSettings {
  // Master switch. When false the daemon does not start a watcher and
  // never publishes VIDEO_ADDED/MODIFIED/REMOVED for un-prompted disk
  // changes — clients fall back to manual ScanLibrary.
  bool enabled = 1;
  // Milliseconds a file's size must hold constant before the watcher
  // believes the writer is done. Default 5000 ms.
  int64 write_settle_ms = 2;
  // Fallback poll interval (ms) used on paths where FSEvents / inotify
  // can't deliver events (NFS / SMB / SAN). 0 disables the poll
  // fallback entirely. Default 30 000 ms.
  int64 poll_interval_ms = 3;
}

// --- Lightroom-style user marks ---

// Apply a rating (0..5) to one or more videos. Sending video_ids of length
// > 1 lets the keyboard shortcut "press 5 with N cards selected" land in
// a single round-trip. `rating` of 0 means "unrated" (clear).
message UpdateVideoRatingRequest {
  repeated string video_ids = 1;
  int32 rating = 2;          // 0..5
}

// Apply a color label to one or more videos. `color_label` must be one of
// "" (no label / clear), "red", "yellow", "green", "blue", "purple". The
// daemon validates and rejects unknown values.
message UpdateVideoColorLabelRequest {
  repeated string video_ids = 1;
  string color_label = 2;
}

// --- Grid layout preferences (per-catalog) ---

// GridSettings carries the catalog-scoped layout configuration that needs
// to be shared between clients opening the same catalog. Today it only
// covers the four configurable top-of-card stat slots; future fields can
// be added here without bumping a major version.
message GetGridSettingsRequest {}

message GridSettings {
  // Exactly four entries, one per slot (top-left, mid-left, top-right,
  // mid-right). Each is a stat key the client knows how to render — e.g.
  // "filename", "file_size", "resolution", "fps", "camera_model". Empty
  // string ("") means "blank slot". Both clients ship the same set of
  // recognized keys; unknown keys render as blank.
  repeated string top_slots = 1;
}

// --- Camera marketing-name mappings (per-catalog overrides) ---
//
// A single mapping entry exposed to the UI. `is_builtin` lets the
// client style built-in vs. user-supplied rows differently; `is_custom`
// is true for any internal name with an active override in the
// catalog's config (which may *be* a built-in name the user has
// re-mapped, in which case both flags are true and `marketing` is the
// user's chosen string).
message CameraNameMapping {
  string internal = 1;
  string marketing = 2;
  bool is_builtin = 3;
  bool is_custom = 4;
}

message ListCameraNameMappingsRequest {}

message ListCameraNameMappingsResponse {
  // Built-in mappings first (alphabetised), then any custom-only
  // entries (i.e. user mappings whose internal name has no built-in
  // counterpart). Each entry's `marketing` already reflects custom
  // overrides — clients can render the string directly.
  repeated CameraNameMapping mappings = 1;
}

// Add or update a custom override. Sending `marketing = ""` deletes
// the override (and reveals the built-in entry, if there is one).
message SetCameraNameMappingRequest {
  string internal = 1;
  string marketing = 2;
}

message LensNameMapping {
  string raw = 1;        // lens string exactly as stored in the catalog
  string alias = 2;      // active display name (custom alias, else `raw`)
  bool is_custom = 3;    // true when a user override is in effect
  bool in_catalog = 4;   // true when this lens currently appears in the catalog
}

message ListLensNameMappingsRequest {}

message ListLensNameMappingsResponse {
  // Catalog lenses first (alphabetised by raw value), then any
  // custom-only overrides whose raw value no longer appears in the
  // catalog. Each entry's `alias` already reflects the override.
  repeated LensNameMapping mappings = 1;
}

// Add or update a custom lens alias. Sending `alias = ""` deletes the
// override and falls back to displaying the raw lens string.
message SetLensNameMappingRequest {
  string raw = 1;
  string alias = 2;
}

// Structured error codes.  Field 0 (ERROR_UNKNOWN) is the proto3 default,
// meaning "no error" or "error type not specified".  Codes are intentionally
// stable — never renumber or reuse a value.
enum ErrorCode {
  ERROR_UNKNOWN                    = 0;
  ERROR_DATABASE                   = 1;
  ERROR_VIDEO_NOT_FOUND            = 2;
  ERROR_TAG_NOT_FOUND              = 3;
  ERROR_COLLECTION_NOT_FOUND       = 4;
  ERROR_METADATA_EXTRACTION_FAILED = 5;
  ERROR_THUMBNAIL_GENERATION_FAILED = 6;
  ERROR_FILE_NOT_FOUND             = 7;
  ERROR_INVALID_PATH               = 8;
  ERROR_DUPLICATE_ENTRY            = 9;
  ERROR_IO                         = 10;
  ERROR_CONFIG                     = 11;
  ERROR_FFMPEG                     = 12;
  ERROR_INVALID_REQUEST            = 13;
  ERROR_INTERNAL                   = 14;
}

// Generic responses

message Response {
  bool success = 1;
  string message = 2;
  string error = 3;
  // Structured error code; ERROR_UNKNOWN (0) when success is true.
  int32 error_code = 4;
}

// ─── Catalog Sync ────────────────────────────────────────────────────────────

message SyncManifestRequest {
  ListVideosRequest filter = 1;
  string smart_filter_json = 2;
  string cursor = 3;
  int32 page_size = 4;
}

message SyncManifestEntry {
  string video_id = 1;
  string content_hash = 2;
  bool hash_pending = 3;
  int64 marks_rev = 4;
  int64 size_bytes = 5;
  int64 duration_ms = 6;
  int64 creation_date_ms = 7;
  string filename = 8;
  int32 width = 9;
  int32 height = 10;
  string codec_video = 11;
  bool is_derived = 12;
  bool has_streamable_proxy = 13;
  string next_cursor = 14;
}

message LookupByContentHashRequest {
  repeated string content_hash = 1;
}

message LookupByContentHashResponse {
  message Hit {
    string content_hash = 1;
    string video_id = 2;
    int64 marks_rev = 3;
    int64 duration_ms = 4;
    int64 creation_date_ms = 5;
  }
  repeated Hit hits = 1;
}

message VideoCatalogDataRequest {
  string video_id = 1;
}

message SmartCollectionSpec {
  string name = 1;
  string filter_json = 2;
}

message GroupSpec {
  string name = 1;
  string base_name = 2;
  string preferred_origin_hash = 3;
}

message VideoCatalogData {
  repeated string tags = 1;
  repeated string tag_colors = 2;
  repeated string collections = 3;
  repeated SmartCollectionSpec smart = 4;
  int32 rating = 5;
  string color_label = 6;
  string notes = 7;
  int64 creation_date_ms = 8;
  double gps_lat = 9;
  double gps_lon = 10;
  bool gps_valid = 11;
  int64 marks_rev = 12;
  GroupSpec group = 13;
  // Local video id that this video is a proxy/derived copy of. Empty when
  // not a proxy. Applied by apply_video_catalog_data to write videos.proxy_of.
  string proxy_of_id = 14;
}

message ApplyCatalogDataRequest {
  string video_id = 1;
  VideoCatalogData data = 2;
}

message PrepareRenditionRequest {
  string video_id = 1;
  int32 target_height = 2;
}

message PrepareRenditionProgress {
  enum Phase {
    QUEUED = 0;
    TRANSCODING = 1;
    PROMOTING = 2;
    READY = 3;
    FAILED = 4;
  }
  Phase phase = 1;
  float fraction = 2;
  string detail = 3;
  int32 ready_height = 4;
  int64 rendition_bytes = 5;
  string download_path = 6;
}

message ListSyncProfilesRequest {}

message SyncProfileProto {
  string id = 1;
  string name = 2;
  string peer_key = 3;
  string direction = 4;
  string filter_json = 5;
  int32 target_height = 6;
  string collection_resolutions = 7;
  string device_label = 8;
  int64 last_run_ms = 9;
  int64 created_ms = 10;
  int64 updated_ms = 11;
}

message ListSyncProfilesResponse {
  repeated SyncProfileProto profiles = 1;
}

message UpsertSyncProfileRequest {
  SyncProfileProto profile = 1;
}

message SyncProfileResponse {
  string id = 1;
}

message DeleteSyncProfileRequest {
  string id = 1;
}

message GetSyncRunRequest {
  string run_id = 1;
}

message SyncRunResponse {
  string id = 1;
  string state = 2;
  int64 total = 3;
  int64 completed = 4;
  int64 failed = 5;
  int64 conflicts = 6;
  int64 started_ms = 7;
  int64 finished_ms = 8;
}
