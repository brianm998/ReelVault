syntax = "proto3";

package videoroom;

// Core service definition
service VideoRoom {
  // Query operations
  rpc ListVideos(ListVideosRequest) returns (ListVideosResponse);
  rpc SearchVideos(SearchRequest) returns (SearchResponse);
  rpc GetMetadata(GetMetadataRequest) returns (VideoMetadata);
  rpc GetThumbnail(GetThumbnailRequest) returns (stream ThumbnailChunk);

  // Library management
  rpc AddLibraryLocation(AddLocationRequest) returns (LocationResponse);
  rpc RemoveLibraryLocation(RemoveLocationRequest) returns (LocationResponse);
  rpc ListLibraryLocations(ListLocationsRequest) returns (ListLocationsResponse);
  rpc ScanLibrary(ScanLibraryRequest) returns (stream ScanProgress);
  rpc GetScanStatus(GetScanStatusRequest) returns (ScanStatusResponse);

  // Tags
  rpc CreateTag(CreateTagRequest) returns (TagResponse);
  rpc DeleteTag(DeleteTagRequest) returns (Response);
  rpc ListTags(ListTagsRequest) returns (ListTagsResponse);
  rpc TagVideos(TagVideosRequest) returns (Response);
  rpc UntagVideos(UntagVideosRequest) returns (Response);

  // Collections
  rpc CreateCollection(CreateCollectionRequest) returns (CollectionResponse);
  rpc DeleteCollection(DeleteCollectionRequest) returns (Response);
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc AddToCollection(AddToCollectionRequest) returns (Response);
  rpc RemoveFromCollection(RemoveFromCollectionRequest) returns (Response);

  // Video operations
  rpc UpdateVideoNotes(UpdateNotesRequest) returns (Response);
  rpc DeleteVideo(DeleteVideoRequest) returns (Response);

  // Groups (Lightroom-style "stacks")
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse);
  rpc CreateGroup(CreateGroupRequest) returns (GroupResponse);
  rpc UngroupVideo(UngroupVideoRequest) returns (Response);
  rpc SetGroupPreferred(SetGroupPreferredRequest) returns (Response);
  rpc AutoGroupVideos(AutoGroupRequest) returns (AutoGroupResponse);

  // Proxies
  rpc GenerateProxy(GenerateProxyRequest) returns (stream ProxyGenerationProgress);
  rpc ListProxies(ListProxiesRequest) returns (ListProxiesResponse);
  rpc SetProxyOf(SetProxyOfRequest) returns (Response);
  rpc RemoveProxyLink(RemoveProxyLinkRequest) returns (Response);
  rpc DetectProxies(DetectProxiesRequest) returns (DetectProxiesResponse);

  // Filter options (distinct values for the grid's dropdowns)
  rpc GetFilterOptions(GetFilterOptionsRequest) returns (FilterOptions);

  // System
  rpc GetStatus(GetStatusRequest) returns (StatusResponse);
  rpc GetConfig(GetConfigRequest) returns (ConfigResponse);
  rpc UpdateConfig(UpdateConfigRequest) returns (Response);

  // Catalog lifecycle — the catalog is the SQLite file backing the daemon.
  // Switching catalogs at runtime lets a single server process serve multiple
  // libraries over its lifetime; the client treats each as a separate session.
  rpc OpenCatalog(OpenCatalogRequest) returns (CatalogInfo);
  rpc CloseCatalog(CloseCatalogRequest) returns (Response);
  rpc GetCurrentCatalog(GetCurrentCatalogRequest) returns (CatalogInfo);

  // Geolocation — set or correct the GPS coordinates for one or more videos,
  // and enumerate every video that has known coordinates (for the global map).
  rpc UpdateVideoLocation(UpdateVideoLocationRequest) returns (Response);
  rpc ListVideosWithLocations(ListVideosWithLocationsRequest) returns (VideoLocationsResponse);

  // Named locations — user-defined names for specific lat/lon points (e.g.
  // "Home", "Yosemite Valley Visitor Center"). Clients resolve any video's
  // GPS into a name by proximity (default 250 m) using ListNamedLocations,
  // then cache the result. Names are also written by the location picker.
  rpc ListNamedLocations(ListNamedLocationsRequest) returns (NamedLocationsResponse);
  rpc UpsertNamedLocation(UpsertNamedLocationRequest) returns (NamedLocationResponse);
  rpc DeleteNamedLocation(DeleteNamedLocationRequest) returns (Response);

  // Capture date/time — set or correct when a video was recorded. Mirrors
  // UpdateVideoLocation: catalog is always updated; the file's metadata is
  // touched (via ffmpeg's `-metadata creation_time=...`) only when the
  // client asks for it.
  rpc UpdateVideoCaptureDate(UpdateVideoCaptureDateRequest) returns (Response);

  // Lightroom-style user marks. The grid renders the rating as star/dots
  // along the bottom of each card, and the color label as the band-color
  // around the card. Both take a list of video IDs so a multi-select keyboard
  // shortcut applies in a single round-trip.
  rpc UpdateVideoRating(UpdateVideoRatingRequest) returns (Response);
  rpc UpdateVideoColorLabel(UpdateVideoColorLabelRequest) returns (Response);

  // Grid layout preferences — per-catalog so two clients open against the
  // same catalog show the same top-of-card stat slots. GridSettings carries
  // exactly four slot keys (empty string = unset / blank slot).
  rpc GetGridSettings(GetGridSettingsRequest) returns (GridSettings);
  rpc UpdateGridSettings(GridSettings) returns (Response);

  // Live catalog change events. Subscribe once on connect to receive a
  // never-ending stream of `CatalogEvent`s as the daemon's file watcher
  // adds, modifies, or removes videos in the background. The client uses
  // this to refresh its grid without re-polling ListVideos. The first
  // event after subscribing is always `WATCHER_STARTED` (or
  // `WATCHER_DISABLED` if the user turned the watcher off), which lets
  // clients display a "live updates: on/off" affordance without an extra
  // round-trip.
  rpc SubscribeCatalogEvents(SubscribeCatalogEventsRequest) returns (stream CatalogEvent);

  // Watcher settings — surface the three knobs (enabled, write-settle
  // ms, poll-fallback ms) that govern real-time scanning. Updates take
  // effect immediately; the server restarts its watcher with the new
  // settings on UpdateWatchSettings.
  rpc GetWatchSettings(GetWatchSettingsRequest) returns (WatchSettings);
  rpc UpdateWatchSettings(WatchSettings) returns (Response);

  // Camera marketing-name mappings — internal model code → marketing
  // name. The daemon ships a built-in table (see
  // `core/src/camera_names.rs`); users can add their own overrides
  // (or correct built-in entries they disagree with) via the
  // SetCameraNameMapping RPC. List returns the merged view —
  // built-in entries plus any active custom override — so clients
  // can render one unified table with a "Custom" badge on overridden
  // rows. Setting a marketing name equal to "" removes any custom
  // override and reveals the built-in mapping again.
  rpc ListCameraNameMappings(ListCameraNameMappingsRequest)
      returns (ListCameraNameMappingsResponse);
  rpc SetCameraNameMapping(SetCameraNameMappingRequest) returns (Response);
}

// Messages for queries

message ListVideosRequest {
  int32 limit = 1;
  int32 offset = 2;
  string sort_by = 3;  // "name", "date_added", "duration", etc.
  bool sort_ascending = 4;
  repeated string filter_tags = 5;
  string collection_id = 6;
  // Filter to videos whose path is inside this directory (recursive).
  // Empty means "all locations".
  string location_path = 7;
  // Exact-match filters from the top-bar dropdowns. Empty / 0 = no filter.
  string filter_camera = 8;
  string filter_lens = 9;
  string filter_codec = 10;
  int32 filter_capture_year = 11;
  // Geographic proximity filter — set `filter_by_location` true and provide
  // lat/lon/radius_km to limit results to videos whose recorded coordinates
  // fall within `filter_radius_km` of (filter_latitude, filter_longitude).
  // Used when the user taps a pin on the global map.
  bool filter_by_location = 12;
  double filter_latitude = 13;
  double filter_longitude = 14;
  double filter_radius_km = 15;
  // Lightroom-style user-mark filters.
  //   filter_min_rating: 0 = no filter; 1..5 = "≥ this many stars".
  //   filter_color_label: "" = no filter; otherwise exact match
  //     against one of "red" | "yellow" | "green" | "blue" | "purple".
  int32 filter_min_rating = 16;
  string filter_color_label = 17;
}

message VideoSummary {
  string id = 1;
  string filename = 2;
  string path = 3;
  int64 duration_ms = 4;
  int32 width = 5;
  int32 height = 6;
  string codec_video = 7;
  string codec_audio = 8;
  double fps = 9;
  int64 size_bytes = 10;
  int64 indexed_at = 11;  // Unix timestamp ms
  int64 creation_date = 12;
  repeated string tags = 13;
  bool has_thumbnail = 14;
  // Group info
  string group_id = 15;           // Empty if not in a group
  int32 group_size = 16;          // Number of videos in the group (1 if not grouped)
  string group_preferred_id = 17; // Which video to open by default (e.g. on double-click)
  string group_preferred_path = 18; // Direct path to preferred video for convenience
  // Proxy info. `proxy_count` = how many lower-resolution variants of
  // this clip exist in the catalog; the grid renders a small badge when
  // > 0. `proxy_of` = the source video's id when this row is itself a
  // proxy; the grid hides proxies under their source unless the user
  // clicks "show proxies" on the source card. `playable_natively` = the
  // server's verdict that this video fits under the user-configured
  // `max_native_playback_height` — surfaced so the client can render
  // "create a proxy" affordances without re-fetching ConfigResponse.
  int32 proxy_count = 19;
  string proxy_of = 20;
  bool playable_natively = 21;
  // Lightroom-style user marks. `rating` is 0..5 (0 means unrated).
  // `color_label` is "" (no label) or one of "red" / "yellow" / "green" /
  // "blue" / "purple". The grid renders rating as stars/dots in the bottom
  // band and color_label as the band's tint.
  int32 rating = 22;
  string color_label = 23;
  // Camera body. Surfaced on the summary so the grid's configurable
  // top-of-card "Camera" stat slot can render without a per-video
  // VideoMetadata roundtrip. `camera_model` is the raw EXIF string
  // (e.g. "SONY ILCE-7RM3"); `camera_display_name` is the resolved
  // marketing name (e.g. "Sony a7R III") with user overrides applied,
  // falling back to `camera_model` when no mapping exists.
  string camera_model = 24;
  string camera_display_name = 25;
}

message ListVideosResponse {
  repeated VideoSummary videos = 1;
  int64 total_count = 2;
  bool has_more = 3;
}

message SearchRequest {
  string query = 1;
  int32 limit = 2;
  int32 offset = 3;
  repeated string filter_tags = 4;
}

message SearchResponse {
  repeated VideoSummary videos = 1;
  int64 total_count = 2;
}

message GetMetadataRequest {
  string video_id = 1;
}

message VideoMetadata {
  string id = 1;
  string filename = 2;
  string path = 3;
  int64 size_bytes = 4;
  int64 duration_ms = 5;

  // Video technical
  int32 width = 6;
  int32 height = 7;
  double fps = 8;
  int64 bitrate = 9;
  string codec_video = 10;
  string color_space = 11;
  bool hdr = 12;

  // Audio technical
  string codec_audio = 13;
  int32 audio_channels = 14;
  int32 audio_sample_rate = 15;

  // Dates
  int64 creation_date = 16;  // From video metadata
  int64 modification_date = 17;
  int64 indexed_at = 18;

  // EXIF/Camera data
  string camera_model = 19;
  string lens_model = 20;

  // GPS
  double gps_latitude = 21;
  double gps_longitude = 22;
  double gps_altitude = 23;

  // Organization
  repeated string tags = 24;
  repeated string collections = 25;
  string notes = 26;

  // Volume info
  string volume_id = 27;
  bool is_online = 28;

  // Lightroom-style user marks (mirror of VideoSummary.rating /
  // color_label so the detail panel doesn't need a second lookup).
  int32 rating = 29;
  string color_label = 30;
  // Marketing-friendly camera name when the core knows one for
  // `camera_model`. Defaults to `camera_model` verbatim when no
  // mapping is known — clients can detect "no mapping" by checking
  // whether the two fields match.
  string camera_display_name = 31;
}

message GetThumbnailRequest {
  string video_id = 1;
  string size = 2;  // "small", "medium", "large"
}

message ThumbnailChunk {
  bytes data = 1;
}

// Library management

message AddLocationRequest {
  string path = 1;
  bool recursive = 2;
}

message RemoveLocationRequest {
  string path = 1;
}

message LocationResponse {
  bool success = 1;
  string message = 2;
}

message ListLocationsRequest {}

message LibraryLocation {
  string path = 1;
  bool recursive = 2;
  bool enabled = 3;
  int64 video_count = 4;
  int64 last_scanned = 5;
}

message ListLocationsResponse {
  repeated LibraryLocation locations = 1;
}

message ScanLibraryRequest {
  string location_path = 1;  // Optional: scan specific location
  bool force_full_scan = 2;
  bool auto_group = 3;       // If true, auto-group similar variants after scanning

  // Filename-based capture-date inference. When `filename_date_format` is
  // non-empty, the scanner attempts to parse a date from each video's filename
  // and use it as the creation_date when ffprobe doesn't supply one.
  //
  // filename_date_format: "MM-DD-YYYY" | "DD-MM-YYYY" | "YYYY-MM-DD"
  //   The expected ordering of components. Separators in the actual filename
  //   may be `-`, `_`, `.`, or `/` (any non-digit character).
  // filename_date_position: "anywhere" | "beginning" | "end"
  //   Where in the filename (without extension) the date must appear.
  string filename_date_format = 4;
  string filename_date_position = 5;
}

message ScanProgress {
  string status = 1;  // "scanning", "indexing_metadata", "generating_thumbnails", "complete"
  int64 videos_found = 2;
  int64 videos_indexed = 3;
  string current_file = 4;
  double progress_percent = 5;
}

message GetScanStatusRequest {}

message ScanStatusResponse {
  bool is_scanning = 1;
  double progress_percent = 2;
  string current_activity = 3;
  int64 total_videos_in_library = 4;
}

// Tags

message CreateTagRequest {
  string name = 1;
  string color = 2;  // Hex color like "#FF5733"
}

message TagResponse {
  string id = 1;
  string name = 2;
  string color = 3;
  int64 video_count = 4;  // How many videos currently have this tag
}

message DeleteTagRequest {
  string tag_id = 1;
}

message ListTagsRequest {}

message ListTagsResponse {
  repeated TagResponse tags = 1;
}

message TagVideosRequest {
  repeated string video_ids = 1;
  string tag_id = 2;
}

message UntagVideosRequest {
  repeated string video_ids = 1;
  string tag_id = 2;
}

// Collections

message CreateCollectionRequest {
  string name = 1;
  bool is_smart = 2;
  string filter_json = 3;  // For smart collections
}

message CollectionResponse {
  string id = 1;
  string name = 2;
  bool is_smart = 3;
  int64 video_count = 4;
}

message DeleteCollectionRequest {
  string collection_id = 1;
}

message ListCollectionsRequest {}

message ListCollectionsResponse {
  repeated CollectionResponse collections = 1;
}

message AddToCollectionRequest {
  string collection_id = 1;
  repeated string video_ids = 2;
}

message RemoveFromCollectionRequest {
  string collection_id = 1;
  repeated string video_ids = 2;
}

// Video operations

message UpdateNotesRequest {
  string video_id = 1;
  string notes = 2;
}

message DeleteVideoRequest {
  string video_id = 1;
  bool delete_file = 2;  // Also delete from disk
}

// Proxies

message GenerateProxyRequest {
  string video_id = 1;
  // Target proxy height in pixels (e.g. 720, 1080). Width is computed
  // from the source's aspect ratio. If 0, the daemon uses the configured
  // `proxy_target_height` setting (default 720).
  int32 target_height = 2;
  // Optional override for the proxy output path. Empty = use the
  // suggested path beside the source (`<stem>_proxy_<H>p.<ext>`).
  string output_path = 3;
}

message ProxyGenerationProgress {
  string status = 1;  // "started", "encoding", "indexing", "complete", "error"
  double progress_percent = 2;
  string message = 3;
  // Set on the final "complete" message: the new proxy's video_id, so
  // the client can refresh the source video's metadata to show it.
  string proxy_video_id = 4;
}

message ListProxiesRequest {
  string video_id = 1;
}

message ProxyInfo {
  string id = 1;             // The proxy's video_id.
  string filename = 2;
  string path = 3;
  int64 size_bytes = 4;
  int32 width = 5;
  int32 height = 6;
  // Thumbnail-similarity confidence at detection time. 1.0 for proxies
  // that VideoRoom generated itself or that the user marked manually.
  double confidence = 7;
  bool auto_detected = 8;    // True if VideoRoom inferred this link.
}

message ListProxiesResponse {
  repeated ProxyInfo proxies = 1;
}

// Set or clear a manual proxy_of pointer. Used by the right-panel
// "This is a proxy of …" picker. `original_id` empty = clear *all*
// proxy links for `proxy_id` (the row stops being a proxy of anything).
// To break a single master/proxy pair without affecting other masters,
// use `RemoveProxyLink` instead.
message SetProxyOfRequest {
  string proxy_id = 1;
  string original_id = 2;   // Empty to un-mark every link for this proxy.
}

// Remove a single master ↔ proxy edge from the junction table. Lets
// the user "break" an incorrect auto-detection without wiping the row's
// other (correct) proxy relationships.
message RemoveProxyLinkRequest {
  string master_id = 1;
  string proxy_id = 2;
}

// Sweep the catalog for thumbnail-similar pairs and mark proxies. Idempotent.
message DetectProxiesRequest {}

message DetectProxiesResponse {
  int32 pairs_compared = 1;
  int32 proxies_marked = 2;
  string message = 3;
}

// System / Config

message GetStatusRequest {}

message StatusResponse {
  bool running = 1;
  int64 total_videos = 2;
  int64 total_library_size_bytes = 3;
  int64 cache_size_bytes = 4;
  int64 uptime_seconds = 5;
  string version = 6;
}

message GetConfigRequest {}

message ConfigResponse {
  int32 proxy_threshold_scale = 1;  // 4 = generate proxies for videos > 4x resolution
  string thumbnail_cache_path = 2;
  int32 max_concurrent_jobs = 3;
  bool enable_auto_tagging = 4;
  // Reserved: field 5 previously held `repeated ExternalEditor external_editors`,
  // removed when the external-editor launching feature was retired in favor of
  // drag-and-drop export.
  reserved 5;
  reserved "external_editors";
  // Largest height (in pixels) we'll attempt to play natively in-grid.
  // Videos taller than this are marked "too large to play here" and the
  // user is offered the option to make a proxy. Default 2160 (4K).
  int32 max_native_playback_height = 6;
  // Default height (px) for newly-generated proxies. Default 720.
  int32 proxy_target_height = 7;
}

message UpdateConfigRequest {
  int32 proxy_threshold_scale = 1;
  int32 max_concurrent_jobs = 2;
  bool enable_auto_tagging = 3;
  int32 max_native_playback_height = 4;
  int32 proxy_target_height = 5;
}

// Groups

message ListGroupMembersRequest {
  string group_id = 1;
}

message ListGroupMembersResponse {
  repeated VideoSummary members = 1;
  string preferred_video_id = 2;
}

message CreateGroupRequest {
  repeated string video_ids = 1;
  string name = 2;
  string preferred_video_id = 3;  // Optional - defaults to first
}

message GroupResponse {
  string id = 1;
  string name = 2;
  int32 size = 3;
  string preferred_video_id = 4;
}

message UngroupVideoRequest {
  string video_id = 1;
}

message SetGroupPreferredRequest {
  string group_id = 1;
  string video_id = 2;
}

message AutoGroupRequest {
  // If true, only group videos that share the same parent directory.
  bool same_directory_only = 1;
  // If true, require duration to match within 5%.
  bool match_duration = 2;
  // If true, require fps to be identical (rounded).
  bool match_fps = 3;
}

message AutoGroupResponse {
  int32 groups_created = 1;
  int32 videos_grouped = 2;
  string message = 3;
}

// Filter dropdown options (distinct values present in the library).
//
// The client uses these to populate the dropdowns next to the search field.
// Empty lists mean "no data for that field" and the client hides the dropdown.

message GetFilterOptionsRequest {}

message FilterOptions {
  repeated string cameras = 1;
  repeated string lenses = 2;
  repeated string codecs = 3;
  repeated int32 capture_years = 4;
  // Marketing-friendly names for each entry in `cameras`, in the same
  // order. Each value is either the curated marketing name (e.g.
  // "Sony a7R III") or — when no mapping exists — the internal name
  // verbatim. Clients can use these as the dropdown labels while
  // sending the matching `cameras` entry as the filter value.
  repeated string camera_display_names = 5;
}

// Catalog lifecycle

// Open / switch to the catalog file at `path`. If a catalog is currently
// open it's closed first. The file is created if it doesn't exist; the
// daemon initializes the schema on its first open.
message OpenCatalogRequest {
  string path = 1;
}

message CloseCatalogRequest {}

message GetCurrentCatalogRequest {}

// Information about the catalog the daemon currently has open. `path` is
// empty when no catalog is open — clients should treat that as a precondition
// failure for every other RPC.
message CatalogInfo {
  string path = 1;
  string name = 2;           // Display name (filename stem, e.g. "MyLibrary")
  int64 video_count = 3;     // Total videos currently indexed
  int64 opened_at_ms = 4;    // Unix ms at which this catalog was opened
}

// Geolocation

// Set or replace GPS coordinates on a single video. The catalog's metadata
// row is updated atomically. If `write_to_file` is true the daemon also
// writes the ISO 6709 `location` tag into the underlying video file via
// ffmpeg's `-metadata location=...` (using `-c copy` so no re-encoding
// happens). File mutation is opt-in because some users won't want VideoRoom
// touching their original files.
message UpdateVideoLocationRequest {
  string video_id = 1;
  double latitude = 2;
  double longitude = 3;
  double altitude = 4;       // 0 if unknown
  bool write_to_file = 5;    // embed in the video file as well as the catalog
}

message ListVideosWithLocationsRequest {}

// A geotagged video — the minimum a client needs to render a pin on the
// global map and turn it into a grid filter when tapped.
message VideoLocation {
  string id = 1;
  string filename = 2;
  string path = 3;
  double latitude = 4;
  double longitude = 5;
  double altitude = 6;
  bool has_thumbnail = 7;
}

message VideoLocationsResponse {
  repeated VideoLocation locations = 1;
}

// User-named place (e.g. "Home" → 37.7749, -122.4194). The clients fetch
// every named location for the active catalog once on dialog open, then
// resolve each video's GPS to a name client-side by picking the nearest
// entry whose haversine distance is within `radius_m`.
message NamedLocation {
  string id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  double radius_m = 5;     // Resolution tolerance. Default 250 on new rows.
  int64 created_at_ms = 6; // Unix milliseconds (UTC), 0 if unknown.
  int64 updated_at_ms = 7;
}

message ListNamedLocationsRequest {}

message NamedLocationsResponse {
  repeated NamedLocation locations = 1;
}

// Insert or update a named location. If `id` is empty, a new row is created;
// otherwise the existing row is updated. `radius_m <= 0` falls back to the
// schema default (250 m).
message UpsertNamedLocationRequest {
  string id = 1;
  string name = 2;
  double latitude = 3;
  double longitude = 4;
  double radius_m = 5;
}

message NamedLocationResponse {
  bool success = 1;
  string message = 2;
  NamedLocation location = 3;  // The persisted row (with assigned id, timestamps).
}

message DeleteNamedLocationRequest {
  string id = 1;
}

// Capture date/time

// Set or replace the capture time on a single video. `timestamp_ms` is
// Unix milliseconds (UTC). If `write_to_file` is true the daemon embeds it
// into the underlying video file's container metadata via ffmpeg's
// `-metadata creation_time=...` (using `-c copy`, no re-encoding).
message UpdateVideoCaptureDateRequest {
  string video_id = 1;
  int64 timestamp_ms = 2;
  bool write_to_file = 3;
}

// --- Real-time catalog events (server → client) ---

message SubscribeCatalogEventsRequest {}

// A single change observed by the server's file watcher. `video_id` is set
// when the event refers to a specific video row; for watcher-lifecycle
// events (`WATCHER_STARTED`, `WATCHER_DISABLED`) it's empty and the client
// just updates its "live updates" indicator.
message CatalogEvent {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    VIDEO_ADDED = 1;         // A new video was indexed.
    VIDEO_MODIFIED = 2;      // An existing video's file changed on disk.
    VIDEO_REMOVED = 3;       // A file disappeared; the video is now offline.
    WATCHER_STARTED = 4;     // Sent once on subscription when the watcher is active.
    WATCHER_DISABLED = 5;    // Sent once on subscription if watch_enabled = false.
    SCAN_STARTED = 6;        // A user-driven ScanLibrary just kicked off.
    SCAN_COMPLETED = 7;      // A user-driven ScanLibrary just finished.
  }
  Kind kind = 1;
  string video_id = 2;       // Empty for watcher-lifecycle events.
  string path = 3;           // The file that triggered the event (best-effort).
  int64 at_ms = 4;           // Server-side Unix milliseconds.
  // Optional human-readable note. For SCAN_* events, the user-facing
  // location path; for VIDEO_REMOVED, the prior filename so the client
  // can display a meaningful toast.
  string message = 5;
}

// --- Watch settings (client ↔ server) ---

message GetWatchSettingsRequest {}

message WatchSettings {
  // Master switch. When false the daemon does not start a watcher and
  // never publishes VIDEO_ADDED/MODIFIED/REMOVED for un-prompted disk
  // changes — clients fall back to manual ScanLibrary.
  bool enabled = 1;
  // Milliseconds a file's size must hold constant before the watcher
  // believes the writer is done. Default 5000 ms.
  int64 write_settle_ms = 2;
  // Fallback poll interval (ms) used on paths where FSEvents / inotify
  // can't deliver events (NFS / SMB / SAN). 0 disables the poll
  // fallback entirely. Default 30 000 ms.
  int64 poll_interval_ms = 3;
}

// --- Lightroom-style user marks ---

// Apply a rating (0..5) to one or more videos. Sending video_ids of length
// > 1 lets the keyboard shortcut "press 5 with N cards selected" land in
// a single round-trip. `rating` of 0 means "unrated" (clear).
message UpdateVideoRatingRequest {
  repeated string video_ids = 1;
  int32 rating = 2;          // 0..5
}

// Apply a color label to one or more videos. `color_label` must be one of
// "" (no label / clear), "red", "yellow", "green", "blue", "purple". The
// daemon validates and rejects unknown values.
message UpdateVideoColorLabelRequest {
  repeated string video_ids = 1;
  string color_label = 2;
}

// --- Grid layout preferences (per-catalog) ---

// GridSettings carries the catalog-scoped layout configuration that needs
// to be shared between clients opening the same catalog. Today it only
// covers the four configurable top-of-card stat slots; future fields can
// be added here without bumping a major version.
message GetGridSettingsRequest {}

message GridSettings {
  // Exactly four entries, one per slot (top-left, mid-left, top-right,
  // mid-right). Each is a stat key the client knows how to render — e.g.
  // "filename", "file_size", "resolution", "fps", "camera_model". Empty
  // string ("") means "blank slot". Both clients ship the same set of
  // recognized keys; unknown keys render as blank.
  repeated string top_slots = 1;
}

// --- Camera marketing-name mappings (per-catalog overrides) ---
//
// A single mapping entry exposed to the UI. `is_builtin` lets the
// client style built-in vs. user-supplied rows differently; `is_custom`
// is true for any internal name with an active override in the
// catalog's config (which may *be* a built-in name the user has
// re-mapped, in which case both flags are true and `marketing` is the
// user's chosen string).
message CameraNameMapping {
  string internal = 1;
  string marketing = 2;
  bool is_builtin = 3;
  bool is_custom = 4;
}

message ListCameraNameMappingsRequest {}

message ListCameraNameMappingsResponse {
  // Built-in mappings first (alphabetised), then any custom-only
  // entries (i.e. user mappings whose internal name has no built-in
  // counterpart). Each entry's `marketing` already reflects custom
  // overrides — clients can render the string directly.
  repeated CameraNameMapping mappings = 1;
}

// Add or update a custom override. Sending `marketing = ""` deletes
// the override (and reveals the built-in entry, if there is one).
message SetCameraNameMappingRequest {
  string internal = 1;
  string marketing = 2;
}

// Generic responses

message Response {
  bool success = 1;
  string message = 2;
  string error = 3;
}
