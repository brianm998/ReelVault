# cargo-deny: CI runs `cargo deny check advisories` only.
[advisories]
version = 2
# Scope setting, not an ignore entry: only flag unmaintained crates the workspace
# depends on directly, so the transitive rustls-pemfile (unmaintained, not a
# vulnerability) does not fail the check.
unmaintained = "workspace"
# No vulnerability advisory is ignored here.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no patched release. Migration to jiff or time is a separate follow-up task (#984)." },
]
