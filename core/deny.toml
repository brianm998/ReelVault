# cargo-deny: CI runs `cargo deny check advisories` only.
[advisories]
version = 2
# Only flag unmaintained crates the workspace depends on directly.
unmaintained = "workspace"
# Unmaintained-crate notices only; no vulnerability advisory is ignored here.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained; no patched release. Migration to jiff or time is a separate follow-up task." },
]
