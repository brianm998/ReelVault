[package]
name = "reelvault-core"
version = "0.3.7"
edition = "2021"
license = "LGPL-2.1-or-later"
description = "Backend daemon for ReelVault — a cross-platform video cataloging application."
repository = "https://github.com/reelvault/reelvault"
readme = "../README.md"

[lib]
name = "reelvault_core"
path = "src/lib.rs"
# rlib for the desktop bins; staticlib so the iOS embed can link the core as a
# single `.a` inside an XCFramework (see docs/IOS_CORE_PORT.md §8.1); cdylib so
# the Android app can bundle the core as `libreelvault_core.so` in jniLibs.
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = { version = "0.1", features = ["net"] }

# gRPC and serialization. The "tls" feature adds the rustls-backed
# ServerTlsConfig used for the LAN-facing listener (--remote).
tonic = { version = "0.11", features = ["tls"] }
prost = "0.12"
prost-types = "0.12"

# Self-signed TLS identity for the LAN listener (--remote). The daemon presents
# a self-signed cert that the iOS client pins by SHA-256 fingerprint (no CA).
# base64 is used to PEM-wrap the exact DER we fingerprint, so the presented cert
# and the advertised fingerprint are guaranteed to be the same bytes (rcgen
# re-signs on each serialize call, so we must serialize the DER only once).
rcgen = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

# mDNS/Bonjour advertisement so LAN clients (iOS) auto-discover the daemon.
# Pure-Rust; one code path across macOS/Linux/Windows.
mdns-sd = "0.11"

# HTTPS media server (range download/stream + upload) for remote clients, on
# the same self-signed identity cert. axum-server provides the rustls binding.
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Camera sensor-spec fetch (sensor_cache.rs) — replaces shelling out to `curl`,
# which iOS can't do. rustls + bundled webpki roots (no OpenSSL, links on iOS;
# reuses the rustls already in the tree). `blocking` because the fetch runs on a
# synchronous post_index worker thread, not inside the tokio runtime.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

# rustls is already in the tree transitively (axum-server, reqwest). We depend on
# it directly ONLY to install the process-global `CryptoProvider` at startup:
# rustls 0.23 ends up with *both* providers compiled in — `aws-lc-rs` (axum-server
# + reqwest) and `ring` — so it can't auto-pick one from crate features and panics
# the first time anything builds a Server/ClientConfig. We pick `aws-lc-rs`
# (rustls's own default) explicitly via `install_crypto_provider`. Default
# features include `aws_lc_rs`, which exposes `rustls::crypto::aws_lc_rs`.
rustls = "0.23"

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
rusqlite_migration = "1.2"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# CLI
clap = { version = "4.5", features = ["derive"] }
prettytable-rs = "0.10"
humansize = "2.1"
indicatif = "0.17"

# File operations
walkdir = "2.4"
notify = "6.1"
tempfile = "3.8"
dirs = "5.0"

# Image hashing for proxy auto-detection. We use the `image` crate's
# JPEG decoder + a hand-rolled 64-bit dHash (resize to 9×8, then bit-pack
# per-row sign comparisons). No heavy ML dependency; the dHash literature
# shows it's robust enough to identify "same shot at different
# resolution" with ~95 % accuracy on photographic content.
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

# Data-parallel iteration — used by the scan-time metadata extraction to
# overlap many FFprobe invocations. The FFmpeg semaphore in
# `concurrency.rs` still bounds *external-process* concurrency; rayon just
# lets us have enough in-flight work that the semaphore stays saturated
# under SAN-bound IO latency.
rayon = "1.10"

# Process execution (for FFprobe)
which = "5.0"
serde_with = "3.4"

# Content hashing for catalog sync (sparse blake3 over first+last 8 MiB)
blake3 = "1"

# Pattern matching
regex = "1.10"

# Platform-specific
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process", "resource"] }

[target.'cfg(windows)'.dependencies]
winapi = "0.3"
# Windows Service Control Manager integration: lets the --system-daemon binary
# answer Stop/Shutdown controls and report status to the SCM (see win_service.rs).
windows-service = "0.7"

# Android embed (src/android.rs): JNI bridge so the Kotlin app boots the core
# in-process and provides the native media backend. logcat output goes through
# liblog (`-llog`) directly from src/embed.rs, so no extra logging crate.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

# Development
[dev-dependencies]
criterion = "0.5"
mockall = "0.12"

# Build configuration
[build-dependencies]
tonic-build = "0.11"
serde_json = "1.0"

[[bin]]
name = "reelvault-core"
path = "src/main.rs"

[[bin]]
name = "reelvault-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# Strip debug info + the local symbol table from release artifacts. Keeps the
# exported dynamic symbols (the JNI `Java_*` / iOS `reelvault_*` entry points stay
# resolvable), but shrinks the Android `libreelvault_core.so` from hundreds of MB
# to a few — so the release AAB stays lean without depending on AGP/NDK stripping.
strip = true
