[package]
name = "videoroom-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Backend daemon for VideoRoom — a cross-platform video cataloging application."
repository = "https://github.com/videoroom/videoroom"
readme = "../README.md"

[lib]
name = "videoroom_core"
path = "src/lib.rs"

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }

# gRPC and serialization
tonic = "0.11"
prost = "0.12"
prost-types = "0.12"

# Database
rusqlite = { version = "0.31", features = ["bundled", "chrono", "uuid"] }
rusqlite_migration = "1.2"
uuid = { version = "1.6", features = ["v4", "serde"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# CLI
clap = { version = "4.5", features = ["derive"] }
prettytable-rs = "0.10"
humansize = "2.1"
indicatif = "0.17"

# File operations
walkdir = "2.4"
notify = "6.1"
tempfile = "3.8"
dirs = "5.0"

# Image hashing for proxy auto-detection. We use the `image` crate's
# JPEG decoder + a hand-rolled 64-bit dHash (resize to 9×8, then bit-pack
# per-row sign comparisons). No heavy ML dependency; the dHash literature
# shows it's robust enough to identify "same shot at different
# resolution" with ~95 % accuracy on photographic content.
image = { version = "0.24", default-features = false, features = ["jpeg", "png"] }

# Data-parallel iteration — used by the scan-time metadata extraction to
# overlap many FFprobe invocations. The FFmpeg semaphore in
# `concurrency.rs` still bounds *external-process* concurrency; rayon just
# lets us have enough in-flight work that the semaphore stays saturated
# under SAN-bound IO latency.
rayon = "1.10"

# Process execution (for FFprobe)
which = "5.0"
serde_with = "3.4"

# Pattern matching
regex = "1.10"

# Platform-specific
[target.'cfg(unix)'.dependencies]
nix = { version = "0.27", features = ["process"] }

[target.'cfg(windows)'.dependencies]
winapi = "0.3"

# Development
[dev-dependencies]
criterion = "0.5"
mockall = "0.12"

# Build configuration
[build-dependencies]
tonic-build = "0.11"

[[bin]]
name = "videoroom-core"
path = "src/main.rs"

[[bin]]
name = "videoroom-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
