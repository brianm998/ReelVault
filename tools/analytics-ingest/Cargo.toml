[package]
name = "analytics-ingest"
version = "0.1.0"
edition = "2021"
description = "Internal ops tool: pull install/download analytics from stores into SQLite."

[[bin]]
name = "analytics-ingest"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive", "env"] }

# HTTP
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
csv = "1"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# JWT (Apple ES256)
jsonwebtoken = "9"

# Date/time
chrono = { version = "0.4", features = ["serde"] }

# Compression
flate2 = "1"

# Encoding (Google Play UTF-16LE CSVs)
encoding_rs = "0.8"

# Error handling
anyhow = "1"
thiserror = "1"

# Logging
log = "0.4"
env_logger = "0.11"

# Base64 (for JWT)
base64 = "0.22"
