name: ReelVault
options:
  bundleIdPrefix: com.reelvault
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# Shared client code (models, view-models, gRPC client, discovery, pinned TLS,
# media cache/client) lives in the local SwiftPM package consumed by both apps.
packages:
  ReelVaultKit:
    path: ../kit

targets:
  ReelVault:
    type: application
    platform: iOS
    sources:
      - path: ReelVaultiOS
    dependencies:
      - package: ReelVaultKit
        product: ReelVaultKit
      # Embedded Rust core (on-device "Local Library" mode). Static library, so
      # it is linked, not embedded. Build it first: `make xcframework`
      # (ios/build-core-xcframework.sh). The .xcframework is a generated artifact
      # and is gitignored.
      - framework: Frameworks/ReelVaultCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelvault.ios
        MARKETING_VERSION: "0.3.6"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: ReelVaultiOS/Info.plist
        # Bridge the embedded-core C ABI into Swift. The header is resolved from
        # the core tree (the .xcframework provides the linked symbols).
        SWIFT_OBJC_BRIDGING_HEADER: ReelVaultiOS/ReelVault-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../core/include
        # App icon from Assets.xcassets/AppIcon.appiconset (extracted from the
        # macOS client's AppIcon.icns).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        # The app target uses the Swift 5 language mode to keep the new SwiftUI
        # code free of strict-concurrency churn; ReelVaultKit stays Swift 6.
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: G3L75S65V9
      configs:
        Release:
          # Manual signing for Release/App Store only. Keeping Automatic in base
          # so local device builds stay frictionless. The profile specifier is
          # passed at build time via IOS_PROVISION_PROFILE_SPECIFIER so it isn't
          # hardcoded here, and the variable is only expanded for this target
          # (not SwiftPM dependency targets, which stay on Automatic).
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: $(IOS_PROVISION_PROFILE_SPECIFIER)

schemes:
  ReelVault:
    build:
      targets:
        ReelVault: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
